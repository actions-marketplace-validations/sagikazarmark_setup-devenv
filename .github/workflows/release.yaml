name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A shallow checkout fetches no tags, so the next version would start from v0.0.0.
          fetch-depth: 0

      - name: Calculate the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major="${major#v}"

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          echo "version=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "major=v$major" >> "$GITHUB_OUTPUT"

      # The major tag lets users follow the latest release with uses: ...@v1.
      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git tag "$VERSION"
          git tag --force "$MAJOR"
          git push origin "$VERSION"
          git push --force origin "$MAJOR"

      # GitHub has no API for listing a release on the Marketplace,
      # so the release starts as a draft for a maintainer to publish from the UI.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # gh puts these notes before the generated ones.
          notes="$(cat <<EOF
          ## Usage

          \`\`\`yaml
          - name: Set up devenv
            uses: $GITHUB_REPOSITORY@$(git rev-parse HEAD) # $VERSION
          \`\`\`
          EOF
          )"

          url="$(gh release create "$VERSION" --draft --verify-tag --generate-notes --notes "$notes" --title "$VERSION")"

          {
            echo "Drafted release [$VERSION]($url)."
            echo
            echo "Edit it, check **Publish this Action to the GitHub Marketplace**, then publish it."
          } >> "$GITHUB_STEP_SUMMARY"
